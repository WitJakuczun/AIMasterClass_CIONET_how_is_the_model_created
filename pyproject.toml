[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-masterclass-cionet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.7.4.5",
    "kagglehub>=0.3.13",
    "notebook>=7.4.5",
    "peft>=0.17.1",
    "scikit-learn>=1.7.2",
    "tensorflow==2.19.0",
    "tf-keras>=2.19.0",
    "transformers>=4.56.2",
    "torch",
    "accelerate",
    "trl>=0.23.0",
    "typer>=0.19.2",
    "loguru>=0.7.2",
    "numpy>=1.26.0",
    "pydantic>=2.8.2",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "tqdm>=4.66.1",
    "google-generativeai>=0.8.5",
    "term-image>=0.7.0",
    "polars>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
]

[project.scripts]
cli = "main:app"
chatml = "chatml.chat:run_chat"

[tool.uv]
package = true

[tool.setuptools]
packages = ["mlops", "models", "data", "chatml"]
py-modules = ["main", "config", "models_config", "evaluate"]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E), isort (I), pydocstyle (D), and Bandit (S)
select = ["E", "F", "I", "D", "S"]
ignore = [
    "D203", # one-blank-line-before-class (incompatible with D211)
    "D213", # multi-line-summary-second-line (incompatible with D212)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9_]+))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. 
# Markdown, reStructuredText code blocks are supported.
docstring-code-format = true

# Set the line length limit used when formatting code examples in docstrings.
docstring-code-line-length = "dynamic"
